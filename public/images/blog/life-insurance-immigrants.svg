<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17281b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="800" cy="180" r="220" fill="#3d6b5a" opacity="0.2"/>
  <circle cx="400" cy="480" r="140" fill="#3d6b5a" opacity="0.15"/>
  <path d="M100,380 Q350,280 600,350 T1100,300" stroke="#5a9a7a" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- Family silhouette -->
  <g transform="translate(450,180)" fill="#c8dcc8" opacity="0.85">
