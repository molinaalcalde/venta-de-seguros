    <path d="M40,10 Q0,10 0,40 L10,40 Q10,25 40,25 Q70,25 70,40 L80,40 Q80,10 40,10 Z"/>
    <line x1="40" y1="10" x2="40" y2="70" stroke-linecap="round"/>
    <path d="M40,70 Q40,80 48,80 Q56,80 56,70" stroke-linecap="round"/>
